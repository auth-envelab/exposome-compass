name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.12', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install with test dependencies
        run: python -m pip install -e ".[test]"
      - name: Run test suite
        run: python -m pytest -q
      - name: Test installed CLI and example
        run: |
          python -m exposome_compass --version
          python -m exposome_compass demo-create --output output-demo
          python -m exposome_compass verify output-demo/demo_result
